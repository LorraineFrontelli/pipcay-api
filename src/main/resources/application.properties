spring.application.name=picpay

# ----- Banco de dados H2 (em memoria) -----
spring.datasource.url=jdbc:h2:mem:picpaydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' recria/ajusta o schema automaticamente a cada start, sem precisar de scripts SQL manuais
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
